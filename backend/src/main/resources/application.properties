spring.application.name=insurepro

server.port=${PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_SSL_CA}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PEM

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false